<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: Arial, sans-serif;
      padding: 15px;
      margin: 0;
      background: #f4f6f9;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
      color: #333;
      text-align: center;
    }
    .url-box {
      font-size: 11px;
      color: #666;
      word-break: break-all;
      background: #fff;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ddd;
      margin-bottom: 12px;
      max-height: 45px;
      overflow-y: auto;
    }
    button {
      width: 100%;
      background: #007bff;
      color: white;
      border: none;
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    #result {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      display: none;
      text-align: center;
      font-weight: bold;
    }
    .safe {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .phishing {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .score {
      font-size: 12px;
      margin-top: 4px;
      font-weight: normal;
    }
  </style>
</head>
<body>
  <h2>🛡️ PhishShield AI</h2>
  <div class="url-box" id="currentUrl">Fetching URL...</div>
  <button id="scanBtn">Scan This Website</button>
  
  <div id="result">
    <div id="statusText"></div>
    <div class="score" id="confText"></div>
    <ul id="reasonsList" style="text-align: left; font-size: 11px; margin-top: 8px; padding-left: 18px; color: #721c24;"></ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
