<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 14px;
      margin: 0;
      background: #f8f9fa;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      color: #212529;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .url-box {
      font-size: 11px;
      color: #495057;
      background: #e9ecef;
      padding: 8px;
      border-radius: 6px;
      word-break: break-all;
      margin-bottom: 12px;
      max-height: 45px;
      overflow-y: auto;
    }
    button {
      width: 100%;
      background: #0d6efd;
      color: white;
      border: none;
      padding: 9px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { background: #0b5ed7; }
    button:disabled { background: #6c757d; cursor: not-allowed; }

    #result {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }
    .safe {
      background: #d1e7dd;
      border: 1px solid #badbcc;
      color: #0f5132;
    }
    .caution {
      background: #fff3cd;
      border: 1px solid #ffecb5;
      color: #664d03;
    }
    .phishing {
      background: #f8d7da;
      border: 1px solid #f5c2c7;
      color: #842029;
    }
    .status-title {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .confidence {
      font-size: 11px;
      opacity: 0.85;
      margin-bottom: 6px;
    }
    ul {
      margin: 6px 0 0 0;
      padding-left: 18px;
      font-size: 11px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h3>🛡️ AI Phishing Shield</h3>
  <div class="url-box" id="currentUrl">Fetching URL...</div>
  <button id="scanBtn">Scan Website</button>

  <div id="result">
    <div class="status-title" id="statusText"></div>
    <div class="confidence" id="confText"></div>
    <ul id="reasonsList"></ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
